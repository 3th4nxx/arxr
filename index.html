<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>WebAR Cube</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="three"></canvas>
<div id="hud">
    <div id="topbar">
        <div class="brand">WEBAR</div>
        <div id="status">Camera off</div>
    </div>
    <div id="center">
        <div id="message">Tap START</div>
        <div id="submessage">Scan your surroundings</div>
    </div>
    <button id="start">START AR</button>
    <div id="bottom">
        <div id="voice">Say “cube”</div>
        <div id="pinch">🤏 Pinch to grab</div>
    </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
